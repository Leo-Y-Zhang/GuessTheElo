name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Engine replays every game to its reference position
        run: node --test tests/engine.test.mjs
      - name: index.html is up to date with src/app.html
        run: |
          python3 tools/build.py
          git diff --exit-code index.html
